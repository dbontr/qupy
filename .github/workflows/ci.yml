name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure native core
        run: >-
          cmake -S . -B build/native
          -DQUPY_BUILD_PYTHON=OFF
          -DQUPY_BUILD_TESTS=ON
          -DQUPY_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build native core
        run: cmake --build build/native --parallel 4
      - name: Test native core
        run: ctest --test-dir build/native --output-on-failure

  native-core-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure native core
        run: >-
          cmake -S . -B build/native
          -DQUPY_BUILD_PYTHON=OFF
          -DQUPY_BUILD_TESTS=ON
          -DQUPY_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build native core
        run: cmake --build build/native --config Release --parallel 4
      - name: Test native core
        run: ctest --test-dir build/native -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build/sanitizers
          -DQUPY_BUILD_PYTHON=OFF
          -DQUPY_BUILD_TESTS=ON
          -DQUPY_WARNINGS_AS_ERRORS=ON
          -DQUPY_ENABLE_SANITIZERS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build sanitizer target
        run: cmake --build build/sanitizers --parallel 4
      - name: Run sanitizer tests
        run: ctest --test-dir build/sanitizers --output-on-failure

  python-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - run: uv run pytest -q
      - run: uv run ruff check src tests benchmarks
      - run: uv run mypy src/qupy
      - run: uv build
      - name: Confirm native runtime
        run: >-
          uv run python -c "import qupy; assert qupy.core_language() == 'C++20';
          assert qupy.core_version() == '0.3.0a0'; assert qupy.ir_version() == 1"

  python-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest -q
      - run: uv build
      - name: Confirm native runtime
        run: >-
          uv run python -c "import qupy; assert qupy.core_language() == 'C++20';
          assert qupy.core_version() == '0.3.0a0'; assert qupy.ir_version() == 1"

  benchmark-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --frozen --python 3.12
      - name: Install optional benchmark engines
        run: >-
          uv pip install --python .venv/bin/python
          qiskit-aer==0.17.2
          qsimcirq==0.22.1
          stim==1.16.0
      - name: Run benchmark adapter smoke
        run: >-
          uv run --no-sync python -m benchmarks.run
          --profile smoke
          --engines qupy,stim,qsim,aer-statevector,aer-stabilizer
          --warmups 0
          --iterations 1
          --require-engines
          --output build/benchmark-smoke.json
      - name: Validate benchmark report
        run: >-
          uv run --no-sync python -c
          "import json; data=json.load(open('build/benchmark-smoke.json', encoding='utf-8'));
          assert data['schema_version'] == 1;
          assert all(row['valid'] is True for row in data['results'] if not row['skipped'])"
