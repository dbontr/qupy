name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure native core
        run: >-
          cmake -S . -B build/native
          -DQUPY_BUILD_PYTHON=OFF
          -DQUPY_BUILD_TESTS=ON
          -DQUPY_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build native core
        run: cmake --build build/native --parallel 4
      - name: Test native core
        run: ctest --test-dir build/native --output-on-failure

  native-core-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure native core
        run: >-
          cmake -S . -B build/native
          -DQUPY_BUILD_PYTHON=OFF
          -DQUPY_BUILD_TESTS=ON
          -DQUPY_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build native core
        run: cmake --build build/native --config Release --parallel 4
      - name: Test native core
        run: ctest --test-dir build/native -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build/sanitizers
          -DQUPY_BUILD_PYTHON=OFF
          -DQUPY_BUILD_TESTS=ON
          -DQUPY_WARNINGS_AS_ERRORS=ON
          -DQUPY_ENABLE_SANITIZERS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build sanitizer target
        run: cmake --build build/sanitizers --parallel 4
      - name: Run sanitizer tests
        run: ctest --test-dir build/sanitizers --output-on-failure

  mpi-runtime:
    runs-on: ubuntu-latest
    env:
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenMPI
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Configure MPI runtime
        run: >-
          cmake -S . -B build/mpi
          -DQUPY_BUILD_PYTHON=OFF
          -DQUPY_BUILD_TESTS=ON
          -DQUPY_WARNINGS_AS_ERRORS=ON
          -DQUPY_ENABLE_MPI=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build MPI runtime
        run: cmake --build build/mpi --target qupy_mpi_tests --parallel 4
      - name: Test 2-rank and 4-rank MPI reductions
        run: >-
          ctest --test-dir build/mpi -R '^qupy_mpi_'
          --output-on-failure --no-tests=error

  python-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - run: uv run pytest -q
      - run: uv run ruff check src tests benchmarks tools
      - run: uv run mypy src/qupy
      - name: Verify native stubs match runtime
        if: ${{ matrix.python-version == '3.12' }}
        run: |
          uv run --with "nanobind>=3.0.1,<4" python -m nanobind.stubgen \
            -m qupy._native -o .native-runtime.pyi
          uv run python tools/verify_native_stub.py \
            src/qupy/_native.pyi .native-runtime.pyi
      - run: uv build
      - name: Verify built wheel in isolation
        run: uv run python tools/verify_wheel.py --dist-dir dist
      - name: Verify source distribution round trip
        if: ${{ matrix.python-version == '3.12' }}
        run: uv run python tools/verify_wheel.py --dist-dir dist --rebuild-sdist
      - name: Confirm native runtime
        run: >-
          uv run python -c "import qupy; assert qupy.core_language() == 'C++20';
          assert qupy.core_version() == '0.3.0a0'; assert qupy.ir_version() == 1"

  python-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest -q
      - run: uv build
      - name: Verify built wheel in isolation
        run: uv run python tools/verify_wheel.py --dist-dir dist
      - name: Confirm native runtime
        run: >-
          uv run python -c "import qupy; assert qupy.core_language() == 'C++20';
          assert qupy.core_version() == '0.3.0a0'; assert qupy.ir_version() == 1"

  benchmark-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --frozen --python 3.12
      - name: Install optional benchmark engines
        run: >-
          uv pip install --python .venv/bin/python
          qiskit-aer==0.17.2
          qsimcirq==0.22.1
          stim==1.16.0
          pymatching==2.4.0
          ldpc==2.4.1
      - name: Run benchmark adapter smoke
        run: >-
          uv run --no-sync python -m benchmarks.run
          --profile smoke
          --engines qupy,stim,qsim,aer-statevector,aer-stabilizer
          --warmups 0
          --iterations 1
          --require-engines
          --output build/benchmark-smoke.json
      - name: Run MPS benchmark smoke
        run: >-
          uv run --no-sync python -m benchmarks.mps_cost
          --profile smoke
          --warmups 0
          --iterations 1
          --output build/mps-smoke.json
      - name: Test QEC benchmark integration
        run: >-
          uv run --no-sync pytest -q
          tests/test_qec_benchmark.py
          tests/test_qec_ldpc_benchmark.py
      - name: Run surface-code QEC decoder benchmark smoke
        run: >-
          uv run --no-sync python -m benchmarks.qec
          --profile smoke
          --shots 64
          --warmups 0
          --iterations 1
          --max-bp-iterations 20
          --output build/qec-smoke.json
      - name: Run QLDPC decoder benchmark smoke
        run: >-
          uv run --no-sync python -m benchmarks.qec_ldpc
          --profile smoke
          --shots 32
          --warmups 0
          --iterations 1
          --max-bp-iterations 20
          --output build/qec-ldpc-smoke.json
      - name: Validate benchmark reports
        run: >-
          uv run --no-sync python -c
          "import json;
          data=json.load(open('build/benchmark-smoke.json', encoding='utf-8'));
          assert data['schema_version'] == 1;
          assert all(row['valid'] is True for row in data['results'] if not row['skipped']);
          qec=json.load(open('build/qec-smoke.json', encoding='utf-8'));
          assert qec['schema_version'] == 1 and qec['kind'] == 'qec-decoder-evidence';
          assert qec['host']['stim'] == '1.16.0' and qec['host']['pymatching'] == '2.4.0';
          assert len(qec['results']) == 1;
          row=qec['results'][0];
          assert row['error_count'] > 24 and row['syndrome_consistency_rate'] == 1.0;
          assert 0.0 <= row['qupy']['logical_failure_rate'] <= 1.0;
          assert 0.0 <= row['pymatching']['logical_failure_rate'] <= 1.0;
          ldpc=json.load(open('build/qec-ldpc-smoke.json', encoding='utf-8'));
          assert ldpc['schema_version'] == 1 and ldpc['kind'] == 'qec-ldpc-decoder-evidence';
          assert ldpc['host']['ldpc'] == '2.4.1' and len(ldpc['results']) == 1;
          ldpc_row=ldpc['results'][0];
          assert ldpc_row['family'] == 'hypergraph-product-hamming';
          assert ldpc_row['error_count'] == 58 and ldpc_row['logical_qubits'] == 16;
          assert ldpc_row['qupy_syndrome_consistency_rate'] == 1.0;
          assert ldpc_row['ldpc_syndrome_consistency_rate'] == 1.0;
          assert 0.0 <= ldpc_row['qupy']['logical_failure_rate'] <= 1.0;
          assert 0.0 <= ldpc_row['ldpc']['logical_failure_rate'] <= 1.0"

  planner-calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --frozen --python 3.12
      - name: Collect planner calibration evidence
        run: |
          for run in 1 2 3; do
            uv run python -m benchmarks.run \
              --profile calibration \
              --engines qupy \
              --warmups 1 \
              --iterations 3 \
              --require-engines \
              --output "build/planner-calibration-${run}.json"
          done
      - name: Validate and promote planner evidence
        run: >-
          uv run python -m benchmarks.calibrate
          build/planner-calibration-1.json
          build/planner-calibration-2.json
          build/planner-calibration-3.json
          --output build/planner-cost.json
          --planner-output build/planner.qpcost
      - name: Verify native planner artifact
        run: >-
          uv run python -c
          "import qupy as qp;
          model=qp.load_planner_cost_model('build/planner.qpcost');
          plan=qp.expectation_plan(qp.ry(qp.Program(1),0.37,0),qp.Z(0),cost_model=model);
          assert model.host_fingerprint==qp.planner_host_fingerprint();
          assert plan.predicted_ns is not None and plan.predicted_ns>0;
          assert plan.cost_model_fingerprint==model.artifact_fingerprint"
