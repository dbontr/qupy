[build-system]
requires = [
    "scikit-build-core>=1.0,<2",
    "nanobind>=3.0.1,<4",
]
build-backend = "scikit_build_core.build"

[project]
name = "qupy-compute"
version = "0.3.0a0"
description = "Native quantum numerical computing for simulators, hybrid workflows, and QPUs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = ["mypy>=1.17", "pytest>=8.4", "ruff>=0.12"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
wheel.packages = ["src/qupy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["qupy"]
