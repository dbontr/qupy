[build-system]
requires = [
    "scikit-build-core>=1.0,<2",
    "nanobind>=3.0.1,<4",
]
build-backend = "scikit_build_core.build"

[project]
name = "qupy-compute"
version = "0.3.0a0"
description = "Native quantum numerical computing for simulators, hybrid workflows, and QPUs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]
keywords = [
    "quantum-computing",
    "quantum-simulation",
    "numerical-computing",
    "cuda",
    "mpi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.scripts]
qupy-provider-conformance = "qupy.provider_conformance:main"

[project.urls]
Homepage = "https://github.com/dbontr/qupy"
Repository = "https://github.com/dbontr/qupy"
Documentation = "https://github.com/dbontr/qupy/tree/main/docs"
Issues = "https://github.com/dbontr/qupy/issues"

[dependency-groups]
dev = ["mypy>=1.17", "pytest>=8.4", "ruff>=0.12"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
wheel.packages = ["src/qupy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["qupy"]
